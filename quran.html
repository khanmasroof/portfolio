<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al-Quran Al-Kareem</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --gold-dim: #7a6230;
    --bg-deep: #0a0a0f;
    --bg-mid: #11111a;
    --bg-card: #16161f;
    --bg-hover: #1e1e2e;
    --text-primary: #f0e6cc;
    --text-secondary: #9e8f72;
    --text-dim: #5a5248;
    --border: #2a2520;
    --border-gold: rgba(201,168,76,0.25);
    --accent: #8b4513;
    --emerald: #2d6a4f;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Lato', sans-serif;
    background: var(--bg-deep);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg-deep); }
  ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 3px; }

  /* HEADER */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: rgba(10,10,15,0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border-gold);
    padding: 0 24px;
    height: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }

  .logo {
    font-family: 'Cinzel', serif;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.05em;
  }
  .logo span { color: var(--text-secondary); font-weight: 400; font-size: 0.8rem; display: block; letter-spacing: 0.15em; }

  .header-actions { display: flex; gap: 8px; align-items: center; }

  .btn-icon {
    background: none; border: 1px solid var(--border);
    color: var(--text-secondary); width: 38px; height: 38px;
    border-radius: 8px; cursor: pointer; font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .btn-icon:hover { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.08); }
  .btn-icon.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.12); }

  /* SEARCH BAR */
  .search-bar {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 10px; padding: 0 14px; height: 38px;
    width: 260px; transition: border-color 0.2s;
  }
  .search-bar:focus-within { border-color: var(--gold); }
  .search-bar input {
    background: none; border: none; outline: none;
    color: var(--text-primary); font-family: 'Lato', sans-serif;
    font-size: 0.88rem; width: 100%;
  }
  .search-bar input::placeholder { color: var(--text-dim); }
  .search-bar span { color: var(--text-dim); font-size: 0.9rem; }

  /* LAYOUT */
  .app-layout {
    display: flex;
    padding-top: 64px;
    min-height: 100vh;
  }

  /* SIDEBAR */
  .sidebar {
    width: 300px; min-width: 300px;
    background: var(--bg-mid);
    border-right: 1px solid var(--border);
    height: calc(100vh - 64px);
    position: fixed; top: 64px; left: 0;
    overflow-y: auto;
    transition: transform 0.3s ease;
  }

  .sidebar-tabs {
    display: flex; border-bottom: 1px solid var(--border);
    position: sticky; top: 0; background: var(--bg-mid); z-index: 10;
  }
  .sidebar-tab {
    flex: 1; padding: 14px 8px; text-align: center;
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-dim);
    cursor: pointer; border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .sidebar-tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  .surah-list { padding: 8px 0; }

  .surah-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; cursor: pointer;
    transition: background 0.15s; border-left: 3px solid transparent;
    position: relative;
  }
  .surah-item:hover { background: var(--bg-hover); }
  .surah-item.active { background: var(--bg-hover); border-left-color: var(--gold); }

  .surah-num {
    width: 34px; height: 34px; border-radius: 8px;
    background: var(--bg-card); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem; color: var(--gold); font-weight: 700;
    flex-shrink: 0;
  }
  .surah-item.active .surah-num { background: rgba(201,168,76,0.12); border-color: var(--gold-dim); }

  .surah-info { flex: 1; min-width: 0; }
  .surah-name-en { font-size: 0.88rem; font-weight: 700; color: var(--text-primary); }
  .surah-meta { font-size: 0.72rem; color: var(--text-secondary); margin-top: 1px; }

  .surah-name-ar {
    font-family: 'Amiri', serif; font-size: 1.1rem;
    color: var(--gold); direction: rtl;
  }

  .bookmark-icon {
    position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
    color: var(--gold); font-size: 0.75rem; display: none;
  }
  .surah-item.bookmarked .bookmark-icon { display: block; }

  /* MAIN CONTENT */
  .main-content {
    margin-left: 300px;
    flex: 1;
    padding: 32px;
    max-width: calc(100% - 300px);
  }

  /* WELCOME SCREEN */
  .welcome {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: calc(100vh - 128px);
    text-align: center; padding: 40px;
  }

  .welcome-bismillah {
    font-family: 'Amiri', serif;
    font-size: 3rem;
    color: var(--gold);
    direction: rtl;
    margin-bottom: 24px;
    text-shadow: 0 0 40px rgba(201,168,76,0.3);
    animation: fadeInDown 0.8s ease;
  }

  .welcome-title {
    font-family: 'Cinzel', serif;
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 12px;
    animation: fadeInUp 0.8s ease 0.1s both;
  }

  .welcome-sub {
    color: var(--text-secondary);
    font-size: 1rem;
    margin-bottom: 40px;
    animation: fadeInUp 0.8s ease 0.2s both;
  }

  .welcome-stats {
    display: flex; gap: 32px; margin-bottom: 48px;
    animation: fadeInUp 0.8s ease 0.3s both;
  }

  .stat-item { text-align: center; }
  .stat-num { font-family: 'Cinzel', serif; font-size: 1.8rem; color: var(--gold); font-weight: 700; }
  .stat-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.1em; }

  .ornament {
    color: var(--gold-dim); font-size: 2rem; margin: 0 16px;
    line-height: 1; margin-top: 20px;
  }

  .welcome-cta {
    font-family: 'Cinzel', serif;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    color: var(--bg-deep); padding: 14px 36px;
    border: none; border-radius: 8px; font-size: 0.95rem;
    font-weight: 700; cursor: pointer; letter-spacing: 0.05em;
    transition: all 0.2s; animation: fadeInUp 0.8s ease 0.4s both;
  }
  .welcome-cta:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,168,76,0.3); }

  /* SURAH HEADER */
  .surah-header {
    text-align: center;
    padding: 32px 24px 24px;
    border: 1px solid var(--border-gold);
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(201,168,76,0.06) 0%, transparent 100%);
    margin-bottom: 32px;
    position: relative;
    overflow: hidden;
  }

  .surah-header::before {
    content: '';
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 200px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .surah-number-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(201,168,76,0.1); border: 1px solid var(--border-gold);
    color: var(--gold); font-size: 0.78rem; font-weight: 700;
    padding: 5px 14px; border-radius: 20px; letter-spacing: 0.1em;
    text-transform: uppercase; margin-bottom: 16px;
  }

  .surah-arabic-title {
    font-family: 'Amiri', serif;
    font-size: 3rem;
    color: var(--gold);
    direction: rtl;
    margin-bottom: 8px;
    text-shadow: 0 0 30px rgba(201,168,76,0.2);
  }

  .surah-english-title {
    font-family: 'Cinzel', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 12px;
  }

  .surah-details {
    display: flex; gap: 24px; justify-content: center; flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .surah-detail-item {
    font-size: 0.8rem; color: var(--text-secondary);
  }
  .surah-detail-item strong { color: var(--gold); }

  .bismillah-display {
    font-family: 'Amiri', serif;
    font-size: 2rem;
    color: var(--text-primary);
    direction: rtl;
    padding: 16px;
    border-top: 1px solid var(--border);
    margin-top: 8px;
  }

  /* CONTROLS BAR */
  .controls-bar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 24px; flex-wrap: wrap;
  }

  .control-btn {
    display: flex; align-items: center; gap: 7px;
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-secondary); padding: 8px 16px;
    border-radius: 8px; cursor: pointer; font-size: 0.82rem;
    font-family: 'Lato', sans-serif; font-weight: 700;
    letter-spacing: 0.04em; transition: all 0.2s;
  }
  .control-btn:hover { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.06); }
  .control-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.1); }

  .font-size-controls { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .font-size-btn {
    width: 32px; height: 32px; background: var(--bg-card);
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-secondary); cursor: pointer; font-size: 0.9rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .font-size-btn:hover { border-color: var(--gold); color: var(--gold); }
  .font-size-label { font-size: 0.75rem; color: var(--text-dim); }

  /* AYAH CARDS */
  .ayah-list { display: flex; flex-direction: column; gap: 4px; }

  .ayah-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    transition: all 0.2s;
    position: relative;
  }
  .ayah-card:hover { border-color: var(--border-gold); background: var(--bg-hover); }
  .ayah-card.highlighted { border-color: var(--gold); background: rgba(201,168,76,0.05); }
  .ayah-card.bookmarked-ayah { border-left: 3px solid var(--gold); }

  .ayah-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }

  .ayah-num {
    width: 36px; height: 36px;
    background: rgba(201,168,76,0.1);
    border: 1px solid var(--border-gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.78rem; color: var(--gold); font-weight: 700;
  }

  .ayah-actions { display: flex; gap: 6px; opacity: 0; transition: opacity 0.2s; }
  .ayah-card:hover .ayah-actions { opacity: 1; }

  .ayah-action-btn {
    width: 30px; height: 30px; background: var(--bg-mid);
    border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-dim); cursor: pointer; font-size: 0.8rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .ayah-action-btn:hover { border-color: var(--gold); color: var(--gold); }
  .ayah-action-btn.bookmarked { color: var(--gold); border-color: var(--gold-dim); }

  .ayah-arabic {
    font-family: 'Amiri', serif;
    font-size: var(--arabic-size, 2rem);
    line-height: 2.2;
    direction: rtl;
    text-align: right;
    color: var(--text-primary);
    margin-bottom: 16px;
  }

  .ayah-translation {
    font-size: 0.92rem;
    line-height: 1.8;
    color: var(--text-secondary);
    border-top: 1px solid var(--border);
    padding-top: 14px;
    font-style: italic;
  }

  .ayah-tafsir {
    display: none;
    margin-top: 14px;
    padding: 14px;
    background: rgba(45,106,79,0.08);
    border: 1px solid rgba(45,106,79,0.25);
    border-radius: 8px;
    font-size: 0.85rem;
    line-height: 1.8;
    color: var(--text-secondary);
  }
  .ayah-tafsir.visible { display: block; }
  .ayah-tafsir-title {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: #4caf50; font-weight: 700; margin-bottom: 8px;
  }

  /* AUDIO PLAYER */
  .audio-player {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(10,10,15,0.97);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--border-gold);
    padding: 14px 24px;
    display: none; align-items: center; gap: 16px;
    z-index: 200;
  }
  .audio-player.visible { display: flex; }

  .player-info { min-width: 0; }
  .player-surah { font-size: 0.9rem; font-weight: 700; color: var(--gold); }
  .player-ayah { font-size: 0.75rem; color: var(--text-secondary); }

  .player-controls { display: flex; align-items: center; gap: 12px; }

  .play-btn {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--gold), var(--gold-light));
    border: none; border-radius: 50%; cursor: pointer;
    color: var(--bg-deep); font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .play-btn:hover { transform: scale(1.06); box-shadow: 0 0 20px rgba(201,168,76,0.4); }

  .skip-btn {
    background: none; border: none; color: var(--text-secondary);
    cursor: pointer; font-size: 1rem; transition: color 0.2s;
    padding: 8px;
  }
  .skip-btn:hover { color: var(--gold); }

  .progress-wrap { flex: 1; }
  .progress-bar {
    width: 100%; height: 3px; background: var(--border);
    border-radius: 2px; cursor: pointer; position: relative;
  }
  .progress-fill {
    height: 100%; background: var(--gold); border-radius: 2px;
    width: 0%; transition: width 0.1s;
  }
  .progress-times {
    display: flex; justify-content: space-between;
    font-size: 0.7rem; color: var(--text-dim); margin-top: 4px;
  }

  .reciter-select {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-secondary); padding: 6px 10px;
    border-radius: 6px; font-size: 0.78rem;
    font-family: 'Lato', sans-serif; cursor: pointer;
    outline: none;
  }
  .reciter-select:focus { border-color: var(--gold); }

  .close-player {
    background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 1rem; transition: color 0.2s; padding: 4px;
  }
  .close-player:hover { color: var(--text-secondary); }

  /* SEARCH RESULTS */
  .search-results {
    display: none;
    position: absolute;
    top: 64px; left: 0; right: 0;
    background: var(--bg-mid);
    border-bottom: 1px solid var(--border-gold);
    max-height: 400px; overflow-y: auto;
    z-index: 90; padding: 8px;
  }
  .search-results.visible { display: block; }

  .search-result-item {
    padding: 12px 16px; border-radius: 8px; cursor: pointer;
    transition: background 0.15s; display: flex; align-items: flex-start; gap: 12px;
  }
  .search-result-item:hover { background: var(--bg-hover); }

  .search-result-ref {
    font-size: 0.72rem; color: var(--gold); font-weight: 700;
    white-space: nowrap; margin-top: 2px;
  }
  .search-result-text { font-size: 0.85rem; color: var(--text-secondary); line-height: 1.5; }
  .search-result-text mark { background: none; color: var(--gold); font-weight: 700; }

  /* BOOKMARKS PANEL */
  .bookmarks-panel {
    display: none;
    padding: 12px;
  }
  .bookmarks-panel.visible { display: block; }

  .bookmark-entry {
    padding: 12px; border-radius: 8px;
    border: 1px solid var(--border); margin-bottom: 8px;
    cursor: pointer; transition: all 0.15s;
  }
  .bookmark-entry:hover { border-color: var(--border-gold); background: var(--bg-hover); }
  .bookmark-ref { font-size: 0.78rem; color: var(--gold); font-weight: 700; margin-bottom: 4px; }
  .bookmark-preview { font-size: 0.8rem; color: var(--text-secondary); direction: rtl; text-align: right; font-family: 'Amiri', serif; }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 0.88rem; }
  .empty-icon { font-size: 2rem; margin-bottom: 12px; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--bg-card); border: 1px solid var(--border-gold);
    color: var(--gold); padding: 10px 20px; border-radius: 8px;
    font-size: 0.85rem; font-weight: 700;
    opacity: 0; transition: all 0.3s; z-index: 300;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ANIMATIONS */
  @keyframes fadeInDown { from { opacity:0; transform:translateY(-20px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

  .surah-view { animation: fadeIn 0.3s ease; }

  /* LOADING */
  .loading {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 300px; gap: 16px;
  }
  .loading-spinner {
    width: 40px; height: 40px; border: 3px solid var(--border);
    border-top-color: var(--gold); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: var(--text-secondary); font-size: 0.88rem; }

  .play-surah-btn {
    background: linear-gradient(135deg, rgba(201,168,76,0.15), rgba(201,168,76,0.05)) !important;
    border-color: var(--gold-dim) !important;
    color: var(--gold) !important;
    font-size: 0.9rem !important;
    padding: 10px 22px !important;
    position: relative;
    overflow: hidden;
  }
  .play-surah-btn::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(201,168,76,0.2), transparent);
    opacity: 0; transition: opacity 0.2s;
  }
  .play-surah-btn:hover::before { opacity: 1; }
  .play-surah-btn.active {
    background: linear-gradient(135deg, rgba(201,168,76,0.25), rgba(201,168,76,0.1)) !important;
    border-color: var(--gold) !important;
    box-shadow: 0 0 16px rgba(201,168,76,0.2);
    animation: pulse-gold 2s ease-in-out infinite;
  }
  @keyframes pulse-gold {
    0%, 100% { box-shadow: 0 0 12px rgba(201,168,76,0.2); }
    50% { box-shadow: 0 0 24px rgba(201,168,76,0.45); }
  }

  .ayah-counter-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(201,168,76,0.1); border: 1px solid var(--border-gold);
    color: var(--gold); padding: 4px 12px; border-radius: 20px;
    font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em;
    margin-left: auto;
  }
  .geo-bg {
    position: fixed; top: 0; right: 0; width: 500px; height: 500px;
    opacity: 0.03; pointer-events: none; z-index: 0;
  }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); z-index: 50; }
    .sidebar.open { transform: translateX(0); }
    .main-content { margin-left: 0; max-width: 100%; padding: 16px; }
    .search-bar { width: 180px; }
    .welcome-bismillah { font-size: 2rem; }
    .welcome-title { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<!-- GEOMETRIC BG -->
<svg class="geo-bg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#c9a84c" stroke-width="1">
    <polygon points="250,10 490,130 490,370 250,490 10,370 10,130" />
    <polygon points="250,50 450,150 450,350 250,450 50,350 50,150" />
    <polygon points="250,90 410,170 410,330 250,410 90,330 90,170" />
    <circle cx="250" cy="250" r="180"/>
    <circle cx="250" cy="250" r="130"/>
    <circle cx="250" cy="250" r="80"/>
    <line x1="250" y1="10" x2="250" y2="490"/>
    <line x1="10" y1="250" x2="490" y2="250"/>
  </g>
</svg>

<!-- HEADER -->
<header>
  <div class="logo">
    Al-Quran Al-Kareem
    <span>THE NOBLE QURAN</span>
  </div>

  <div class="search-bar">
    <span>🔍</span>
    <input type="text" id="searchInput" placeholder="Search surah, keyword, ayah..." autocomplete="off">
  </div>

  <div class="header-actions">
    <button class="btn-icon" id="bookmarkToggle" title="Bookmarks" onclick="toggleBookmarksView()">🔖</button>
    <button class="btn-icon" id="menuToggle" title="Menu" onclick="toggleSidebar()" style="display:none">☰</button>
  </div>
</header>

<!-- SEARCH RESULTS DROPDOWN -->

function checkMobile() {

function renderSurahList() {
  const list = document.getElementById('surahList');
  list.innerHTML = SURAHS.map(s => `
    <div class="surah-item ${state.bookmarks.some(b=>b.surah===s.n && !b.ayah) ? 'bookmarked' : ''}"

      <div class="surah-num">${s.n}</div>
      <div class="surah-info">
        <div class="surah-name-en">${s.en}</div>
        <div class="surah-meta">${s.meaning} • ${s.ayahs} Ayahs • ${s.type}</div>
      </div>
      <div class="surah-name-ar">${s.ar}</div>
      <span class="bookmark-icon">🔖</span>
    </div>
  `).join('');
}

function switchTab(tab) {
  document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('surah-list-panel').style.display = tab === 'surahs' ? 'block' : 'none';
  document.getElementById('bookmarks-list-panel').classList.toggle('visible', tab === 'bookmarks');
  if (tab === 'bookmarks') renderBookmarksList();
}

// ============================================================
// LOAD SURAH
// ============================================================
async function loadSurah(num) {
  state.currentSurah = num;
  const surah = SURAHS[num - 1];

  document.getElementById('welcomeScreen').style.display = 'none';
  const view = document.getElementById('surahView');
  view.style.display = 'block';

  // Update active in sidebar
  document.querySelectorAll('.surah-item').forEach(el => el.classList.remove('active'));
  const item = document.getElementById('surah-item-'+num);
  if (item) { item.classList.add('active'); item.scrollIntoView({block:'nearest'}); }

  view.innerHTML = `<div class="loading"><div class="loading-spinner"></div><div class="loading-text">Loading ${surah.en}...</div></div>`;

  try {
    const res = await fetch(`https://api.alquran.cloud/v1/surah/${num}/editions/quran-uthmani,en.sahih`);
    const data = await res.json();
    state.ayahData = data.data;
    renderSurah(surah, data.data);
  } catch(e) {
    view.innerHTML = `<div class="loading"><div class="loading-text" style="color:#e57373">Failed to load. Please check your connection.</div></div>`;
  }
}

function renderSurah(surah, editions) {
  const arabic = editions[0];
  const translation = editions[1];
  const view = document.getElementById('surahView');

  const bismillah = surah.n !== 1 && surah.n !== 9

  view.innerHTML = `
    <div class="surah-view">
      <div class="surah-header">
        <div class="surah-number-badge">✦ Surah ${surah.n} of 114 ✦</div>
        <div class="surah-arabic-title">${surah.ar}</div>
        <div class="surah-english-title">${surah.en}</div>
        <div class="surah-details">
          <span class="surah-detail-item"><strong>Meaning:</strong> ${surah.meaning}</span>
          <span class="surah-detail-item"><strong>Type:</strong> ${surah.type}</span>
          <span class="surah-detail-item"><strong>Ayahs:</strong> ${surah.ayahs}</span>
          <span class="surah-detail-item"><strong>Juz:</strong> ${surah.juz}</span>
        </div>
        ${bismillah}
      </div>

      <div class="controls-bar">
        <button class="control-btn ${state.showTranslation ? 'active' : ''}" id="btnTranslation" onclick="toggleTranslation()">
          🌐 Translation
        </button>
        <button class="control-btn ${state.showTafsir ? 'active' : ''}" id="btnTafsir" onclick="toggleTafsir()">
          📖 Tafsir
        </button>
        <button class="control-btn play-surah-btn" id="btnPlaySurah" onclick="toggleFullSurahPlay(${surah.n})">
          🎵 Play Full Surah
        </button>
        <button class="control-btn" onclick="bookmarkSurah(${surah.n})">
          🔖 Bookmark Surah
        </button>
        <div class="font-size-controls">
          <span class="font-size-label">Arabic:</span>
          <button class="font-size-btn" onclick="changeFont(-0.2)">A−</button>
          <button class="font-size-btn" onclick="changeFont(0.2)">A+</button>
        </div>
      </div>

      <div class="ayah-list" id="ayahList">
        ${arabic.ayahs.map((ayah, i) => renderAyah(ayah, translation.ayahs[i], surah)).join('')}
      </div>
    </div>
  `;

  // Apply font size
  document.documentElement.style.setProperty('--arabic-size', state.arabicSize + 'rem');
}

function renderAyah(arAyah, enAyah, surah) {
  const key = `${surah.n}:${arAyah.numberInSurah}`;
  const isBookmarked = state.bookmarks.some(b => b.key === key);

  const tafsirText = getTafsirSnippet(surah.n, arAyah.numberInSurah);

  return `
    <div class="ayah-card ${isBookmarked ? 'bookmarked-ayah' : ''}" id="ayah-${arAyah.numberInSurah}">
      <div class="ayah-header">
        <div class="ayah-num">${arAyah.numberInSurah}</div>
        <div class="ayah-actions">
          <button class="ayah-action-btn ${isBookmarked ? 'bookmarked' : ''}" 
                  title="Bookmark" onclick="toggleAyahBookmark(${surah.n}, ${arAyah.numberInSurah}, this)">🔖</button>
          <button class="ayah-action-btn" title="Play this ayah" 
                  onclick="playAyah(${surah.n}, ${arAyah.numberInSurah})">▶</button>
          <button class="ayah-action-btn" title="Copy" 
                  onclick="copyAyah('${escapeStr(arAyah.text)}', '${escapeStr(enAyah.text)}', ${surah.n}, ${arAyah.numberInSurah})">📋</button>
        </div>
      </div>
      <div class="ayah-arabic" style="font-size: ${state.arabicSize}rem">${arAyah.text}</div>
      <div class="ayah-translation" style="display:${state.showTranslation ? 'block' : 'none'}" id="trans-${arAyah.numberInSurah}">
        ${enAyah.text}
      </div>
      <div class="ayah-tafsir ${state.showTafsir ? 'visible' : ''}" id="tafsir-${arAyah.numberInSurah}">
        <div class="ayah-tafsir-title">📗 Commentary</div>
        ${tafsirText}
      </div>
    </div>
  `;
}

function getTafsirSnippet(surahNum, ayahNum) {
  const tafsirs = {
    "1:1": "Al-Fatiha opens with praise for Allah (glorified and exalted be He), the Master of all worlds, whose mercy encompasses all creation. This verse establishes the fundamental relationship between the servant and Lord.",
    "1:2": "This verse teaches that all forms of praise and gratitude ultimately belong to Allah alone, who created and sustains the entire universe.",
    "1:4": "The Day of Judgment is affirmed here — the day when every soul will face the complete and perfect justice of the Most High.",
    "1:5": "This central ayah of Al-Fatiha represents the covenant between the believer and Allah: worship is for Him alone, and from Him alone do we seek aid.",
    "1:6": "The Straight Path (Sirat al-Mustaqim) refers to the way of guidance — the path of those whom Allah has blessed with His favor.",
    "2:255": "Ayat al-Kursi is the greatest verse in the Quran. It describes Allah's absolute sovereignty, eternal nature, and omniscience. The Prophet ﷺ said whoever recites it after every prayer will enter Paradise.",
    "2:286": "This final verse of Al-Baqarah is among the most comforting in the Quran, assuring believers that Allah does not burden any soul beyond its capacity.",
    "36:1": "The letters Ya-Sin are among the disconnected letters (Huruf Muqatta'at) that open certain surahs. Their precise meaning is known only to Allah.",
    "55:1": "Ar-Rahman, the Most Gracious — this opening divine name sets the tone for the entire surah, which catalogues the countless blessings Allah has bestowed upon creation.",
    "67:1": "This verse affirms that all sovereignty and power belongs exclusively to Allah, who created death and life as a test of which of us excels in deeds.",
    "112:1": "Qul Hu-wallahu Ahad — 'Say: He is Allah, the One.' This surah represents the purest expression of Islamic monotheism (Tawhid). The Prophet ﷺ said it equals one-third of the Quran in reward."
  };
  const key = `${surahNum}:${ayahNum}`;
  return tafsirs[key] || `This is ayah ${ayahNum} of Surah ${SURAHS[surahNum-1].en}. For detailed tafsir, scholars recommend consulting Ibn Kathir's Tafsir or Tafsir al-Jalalayn for deeper commentary on this verse and its contextual meaning within the Quran.`;
}

function escapeStr(s) {
  return (s || '').replace(/'/g, "\\'").replace(/"/g, '\\"').substring(0, 50);
}

// ============================================================
// CONTROLS
// ============================================================
function toggleTranslation() {
  state.showTranslation = !state.showTranslation;
  document.getElementById('btnTranslation').classList.toggle('active', state.showTranslation);
  document.querySelectorAll('[id^="trans-"]').forEach(el => {
    el.style.display = state.showTranslation ? 'block' : 'none';
  });
}

function toggleTafsir() {
  state.showTafsir = !state.showTafsir;
  document.getElementById('btnTafsir').classList.toggle('active', state.showTafsir);
  document.querySelectorAll('[id^="tafsir-"]').forEach(el => {
    el.classList.toggle('visible', state.showTafsir);
  });
}

function changeFont(delta) {
  state.arabicSize = Math.max(1.2, Math.min(4, state.arabicSize + delta));
  document.documentElement.style.setProperty('--arabic-size', state.arabicSize + 'rem');
  document.querySelectorAll('.ayah-arabic').forEach(el => {
    el.style.fontSize = state.arabicSize + 'rem';
  });
}

// ============================================================
// BOOKMARKS
// ============================================================
function toggleAyahBookmark(surahNum, ayahNum, btn) {
  const key = `${surahNum}:${ayahNum}`;
  const surah = SURAHS[surahNum - 1];
  const idx = state.bookmarks.findIndex(b => b.key === key);

  if (idx >= 0) {
    state.bookmarks.splice(idx, 1);
    btn.classList.remove('bookmarked');
    const card = document.getElementById('ayah-'+ayahNum);
    if (card) card.classList.remove('bookmarked-ayah');
    showToast('Bookmark removed');
  } else {
    const arText = state.ayahData ? state.ayahData[0].ayahs[ayahNum-1]?.text : '';
    state.bookmarks.push({ key, surah: surahNum, ayah: ayahNum, surahName: surah.en, arText });
    btn.classList.add('bookmarked');
    const card = document.getElementById('ayah-'+ayahNum);
    if (card) card.classList.add('bookmarked-ayah');
    showToast('Bookmarked ' + surah.en + ' ' + ayahNum);
  }
  saveBookmarks();
}

function bookmarkSurah(num) {
  const surah = SURAHS[num-1];
  const key = `surah:${num}`;
  const idx = state.bookmarks.findIndex(b => b.key === key);
  if (idx >= 0) {
    state.bookmarks.splice(idx, 1);
    showToast('Surah bookmark removed');
  } else {
    state.bookmarks.push({ key, surah: num, surahName: surah.en, isSurah: true });
    showToast('Surah bookmarked: ' + surah.en);
  }
  saveBookmarks();
  renderSurahList();
}

function saveBookmarks() {
  localStorage.setItem('quran_bookmarks', JSON.stringify(state.bookmarks));
}

function renderBookmarksList() {
  const el = document.getElementById('bookmarksList');
  if (state.bookmarks.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">🔖</div>No bookmarks yet.<br>Tap 🔖 on any ayah to save it.</div>`;
    return;
  }
  el.innerHTML = state.bookmarks.map(b => `
    <div class="bookmark-entry" onclick="goToBookmark('${b.key}')">
      <div class="bookmark-ref">${b.isSurah ? '📖 ' : '📍 '}${b.surahName}${b.ayah ? ' : '+b.ayah : ''}</div>
      ${b.arText ? `<div class="bookmark-preview">${b.arText.substring(0,60)}...</div>` : ''}
    </div>
  `).join('');
}

function goToBookmark(key) {
  if (key.startsWith('surah:')) {
    loadSurah(parseInt(key.replace('surah:', '')));
  } else {
    const [s, a] = key.split(':');
    loadSurah(parseInt(s)).then ? null : setTimeout(() => {
      const el = document.getElementById('ayah-'+a);
      if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
    }, 800);
  }
}

function toggleBookmarksView() {
  document.getElementById('bookmarkToggle').classList.toggle('active');
  switchTab('bookmarks');
  document.querySelector('.sidebar-tab[id="tab-bookmarks"]').click();
}

// ============================================================
// COPY
// ============================================================
function copyAyah(ar, en, s, a) {
  const text = `${ar}\n\n${en}\n\n— Quran ${s}:${a}`;
  navigator.clipboard.writeText(text).then(() => showToast('Copied to clipboard!'));
}

// ============================================================
// SEARCH
// ============================================================
function setupSearch() {
  const input = document.getElementById('searchInput');
  input.addEventListener('input', debounce(handleSearch, 300));
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-bar') && !e.target.closest('#searchResults')) {
      document.getElementById('searchResults').classList.remove('visible');
    }
  });
}

function debounce(fn, delay) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
}

async function handleSearch(e) {
  const q = e.target.value.trim();
  const results = document.getElementById('searchResults');

  if (!q || q.length < 2) { results.classList.remove('visible'); return; }

  // Search surah names first
  const surahMatches = SURAHS.filter(s =>
    s.en.toLowerCase().includes(q.toLowerCase()) ||
    s.meaning.toLowerCase().includes(q.toLowerCase()) ||
    s.n.toString() === q
  ).slice(0, 4);

  let html = '';

  if (surahMatches.length) {
    html += surahMatches.map(s => `
      <div class="search-result-item" onclick="loadSurah(${s.n}); document.getElementById('searchResults').classList.remove('visible'); document.getElementById('searchInput').value=''">
        <span class="search-result-ref">Surah ${s.n}</span>
        <span class="search-result-text"><strong>${s.en}</strong> — ${s.meaning}</span>
      </div>
    `).join('');
  }

  // Try API search
  try {
    const res = await fetch(`https://api.alquran.cloud/v1/search/${encodeURIComponent(q)}/all/en.sahih`);
    const data = await res.json();
    if (data.data && data.data.matches) {
      data.data.matches.slice(0, 5).forEach(m => {
        const hl = m.text.replace(new RegExp(q, 'gi'), t => `<mark>${t}</mark>`);
        html += `
          <div class="search-result-item" onclick="loadSurah(${m.surah.number}); document.getElementById('searchResults').classList.remove('visible'); document.getElementById('searchInput').value=''">
            <span class="search-result-ref">${m.surah.englishName} ${m.numberInSurah}</span>
            <span class="search-result-text">${hl}</span>
          </div>
        `;
      });
    }
  } catch(e) {}

  if (!html) {
    html = `<div class="search-result-item"><span class="search-result-text" style="color:var(--text-dim)">No results found for "${q}"</span></div>`;
  }

  results.innerHTML = html;
  results.classList.add('visible');
}

// ============================================================
// AUDIO
// ============================================================
function playAyah(surahNum, ayahNum) {
  const reciter = document.getElementById('reciterSelect').value;
  const surah = SURAHS[surahNum - 1];

  state.currentAyah = ayahNum;
  state.currentSurahAudio = surahNum;

  const ayahGlobal = getGlobalAyahNum(surahNum, ayahNum);
  const url = `https://cdn.islamic.network/quran/audio/128/${reciter}/${ayahGlobal}.mp3`;

  if (state.audio) { state.audio.pause(); }

  state.audio = new Audio(url);
  state.audio.addEventListener('loadedmetadata', () => {
    document.getElementById('totalTime').textContent = formatTime(state.audio.duration);
  });
  state.audio.addEventListener('timeupdate', updateProgress);
  state.audio.addEventListener('ended', () => {
    document.getElementById('playBtn').textContent = '▶';
    state.isPlaying = false;
  });
  state.audio.play();
  state.isPlaying = true;

  document.getElementById('playerSurahName').textContent = surah.en;
  document.getElementById('playerAyahNum').textContent = `Ayah ${ayahNum}`;
  document.getElementById('playBtn').textContent = '⏸';
  document.getElementById('audioPlayer').classList.add('visible');

  // Highlight
  document.querySelectorAll('.ayah-card').forEach(c => c.classList.remove('highlighted'));
  const card = document.getElementById('ayah-'+ayahNum);
  if (card) card.classList.add('highlighted');
}

function toggleFullSurahPlay(surahNum) {
  const btn = document.getElementById('btnPlaySurah');
  if (state.autoPlay && state.currentSurahAudio === surahNum) {
    // Stop full surah
    state.autoPlay = false;
    if (state.audio) { state.audio.pause(); state.audio = null; }
    state.isPlaying = false;
    document.getElementById('audioPlayer').classList.remove('visible');
    document.querySelectorAll('.ayah-card').forEach(c => c.classList.remove('highlighted'));
    if (btn) { btn.textContent = '🎵 Play Full Surah'; btn.classList.remove('active'); }
    showToast('Playback stopped');
    return;
  }
  // Start full surah from beginning
  state.autoPlay = true;
  state.fullSurahNum = surahNum;
  if (btn) { btn.textContent = '⏹ Stop Surah'; btn.classList.add('active'); }
  showToast('Playing full surah — ' + SURAHS[surahNum-1].en);
  playAyahInSequence(surahNum, 1);
}

function playAyahInSequence(surahNum, ayahNum) {
  if (!state.autoPlay || state.fullSurahNum !== surahNum) return;

  const reciter = document.getElementById('reciterSelect').value;
  const surah = SURAHS[surahNum - 1];

  state.currentAyah = ayahNum;
  state.currentSurahAudio = surahNum;

  const ayahGlobal = getGlobalAyahNum(surahNum, ayahNum);
  const url = `https://cdn.islamic.network/quran/audio/128/${reciter}/${ayahGlobal}.mp3`;

  if (state.audio) { state.audio.pause(); state.audio = null; }

  const audio = new Audio(url);
  state.audio = audio;

  audio.addEventListener('loadedmetadata', () => {
    document.getElementById('totalTime').textContent = formatTime(audio.duration);
  });
  audio.addEventListener('timeupdate', updateProgress);
  audio.addEventListener('ended', () => {
    if (!state.autoPlay || state.fullSurahNum !== surahNum) return;
    const nextAyah = ayahNum + 1;
    if (nextAyah <= surah.ayahs) {
      setTimeout(() => playAyahInSequence(surahNum, nextAyah), 400);
    } else {
      // Finished whole surah
      state.autoPlay = false;
      state.isPlaying = false;
      document.getElementById('playBtn').textContent = '▶';
      document.getElementById('playerAyahNum').textContent = 'Completed ✓';
      const btn = document.getElementById('btnPlaySurah');
      if (btn) { btn.textContent = '🎵 Play Full Surah'; btn.classList.remove('active'); }
      showToast('Surah ' + surah.en + ' completed ✓');
      document.querySelectorAll('.ayah-card').forEach(c => c.classList.remove('highlighted'));
    }
  });

  audio.play().catch(() => {});
  state.isPlaying = true;

  document.getElementById('playerSurahName').textContent = surah.en;
  document.getElementById('playerAyahNum').textContent = `Ayah ${ayahNum} / ${surah.ayahs}`;
  document.getElementById('playBtn').textContent = '⏸';
  document.getElementById('audioPlayer').classList.add('visible');

  // Highlight + scroll to current ayah
  document.querySelectorAll('.ayah-card').forEach(c => c.classList.remove('highlighted'));
  const card = document.getElementById('ayah-'+ayahNum);
  if (card) {
    card.classList.add('highlighted');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

function autoNextAyah() {
  if (!state.autoPlay) return;
  const surah = SURAHS[state.currentSurahAudio - 1];
  if (state.currentAyah < surah.ayahs) {
    setTimeout(() => playAyah(state.currentSurahAudio, state.currentAyah + 1), 500);
    state.audio.addEventListener('ended', autoNextAyah);
  }
}

function togglePlay() {
  if (!state.audio) return;
  if (state.isPlaying) {
    state.audio.pause();
    document.getElementById('playBtn').textContent = '▶';
  } else {
    state.audio.play();
    document.getElementById('playBtn').textContent = '⏸';
  }
  state.isPlaying = !state.isPlaying;
}

function prevAyah() {
  if (!state.currentSurahAudio) return;
  if (state.currentAyah > 1) {
    if (state.autoPlay) playAyahInSequence(state.currentSurahAudio, state.currentAyah - 1);
    else playAyah(state.currentSurahAudio, state.currentAyah - 1);
  }
}
function nextAyah() {
  if (!state.currentSurahAudio) return;
  const surah = SURAHS[state.currentSurahAudio - 1];
  if (state.currentAyah < surah.ayahs) {
    if (state.autoPlay) playAyahInSequence(state.currentSurahAudio, state.currentAyah + 1);
    else playAyah(state.currentSurahAudio, state.currentAyah + 1);
  }
}

function updateProgress() {
  if (!state.audio) return;
  const pct = (state.audio.currentTime / state.audio.duration) * 100 || 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('currentTime').textContent = formatTime(state.audio.currentTime);
}

function seekAudio(e) {
  if (!state.audio) return;
  const bar = e.currentTarget;
  const pct = e.offsetX / bar.offsetWidth;
  state.audio.currentTime = pct * state.audio.duration;
}

function changeReciter() {
  if (state.audio && state.isPlaying) {
    playAyah(state.currentSurahAudio, state.currentAyah);
  }
}

function closePlayer() {
  if (state.audio) { state.audio.pause(); state.audio = null; }
  state.isPlaying = false;
  state.autoPlay = false;
  state.fullSurahNum = null;
  document.getElementById('audioPlayer').classList.remove('visible');
  document.querySelectorAll('.ayah-card').forEach(c => c.classList.remove('highlighted'));
  const btn = document.getElementById('btnPlaySurah');
  if (btn) { btn.textContent = '🎵 Play Full Surah'; btn.classList.remove('active'); }
}

function getGlobalAyahNum(surahNum, ayahInSurah) {
  let total = 0;
  for (let i = 0; i < surahNum - 1; i++) total += SURAHS[i].ayahs;
  return total + ayahInSurah;
}

function formatTime(s) {
  if (isNaN(s)) return '0:00';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ============================================================
// START
// ============================================================
init();
</script>
